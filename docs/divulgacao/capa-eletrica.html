<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ObraFlow Elétrica - capa de divulgação</title>
  <link rel="icon" href="../../public/brand/logo-cor.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Oswald; src: url('../../src/app/fonts/oswald-latin.woff2') format('woff2'); font-weight: 500 600; }
    @font-face { font-family: 'Public Sans'; src: url('../../src/app/fonts/public-sans-latin.woff2') format('woff2'); font-weight: 400 700; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #F3F5F9; color: #171717; font-family: 'Public Sans', Arial, sans-serif; }
    .bar { height: 12px; background: #1F3F7A; }
    header { position: absolute; left: 52px; right: 52px; top: 38px; display: flex; justify-content: space-between; align-items: center; }
    .logo { width: 145px; height: auto; }
    .tag { color: #3A62A8; border: 1px solid #C9D3E3; border-radius: 8px; padding: 12px 16px; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    .copy { position: absolute; left: 52px; top: 157px; width: 495px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #3A62A8; margin: 0 0 16px; }
    h1 { font-family: Oswald, Arial, sans-serif; font-size: 78px; line-height: 1.04; font-weight: 600; color: #1F3F7A; margin: 0 0 18px; text-transform: uppercase; }
    .lead { color: #4B5160; font-size: 23px; line-height: 1.4; margin: 0; max-width: 450px; }
    .features { font-size: 15px; color: #1F3F7A; margin-top: 23px; font-weight: 600; }
    .cta { font-size: 17px; font-weight: 700; color: #3A62A8; margin-top: 19px; }
    .screen { position: absolute; left: 590px; top: 153px; width: 558px; background: #fff; border: 1px solid #C9D3E3; border-top: 7px solid #3A62A8; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(31,63,122,.06); }
    .screen img { display: block; width: 100%; height: auto; }
    footer { position: absolute; left: 52px; right: 52px; bottom: 22px; border-top: 1px solid #C9D3E3; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; color: #4B5160; font-size: 12px; }
    footer strong { color: #1F3F7A; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <header>
    <img class="logo" src="../../public/brand/logo-cor.svg" alt="RLM Soluções Industriais">
    <span class="tag">DO PLANEJAMENTO AO CAMPO</span>
  </header>
  <div class="copy">
    <p class="eyebrow">ACOMPANHAMENTO DE OBRAS ELÉTRICAS</p>
    <h1>ObraFlow<br>Elétrica</h1>
    <p class="lead">Etapas, diário e pendências<br>em uma visão organizada.</p>
    <p class="features">Planeje. Registre. Acompanhe.</p>
    <p class="cta">Explore a demonstração →</p>
  </div>
  <div class="screen"><img src="assets/painel-eletrica.png" alt="Tela real da demonstração ObraFlow Elétrica, com dados fictícios"></div>
  <footer>
    <span><strong>RLM Soluções Industriais</strong> · MVP com dados fictícios</span>
    <span>lucena0123.github.io/obraflow/eletrica/</span>
  </footer>
</body>
</html>
